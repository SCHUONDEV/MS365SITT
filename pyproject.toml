[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms365sitt"
version = "0.1.0"
description = "MS365 Security and Compliance Checking and Settings Tool"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "SCHUONDEV"}
]
dependencies = [
    "msal>=1.20.0",
    "requests>=2.28.0",
    "python-dotenv>=0.19.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
]

[project.scripts]
ms365sitt = "ms365sitt.cli:main"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
